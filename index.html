    <script>
      (function() {
        var origError = console.error;
        console.error = function() {
          var fullMsg = Array.prototype.slice.call(arguments).map(function(a) {
            return typeof a === 'string' ? a : (a && a.message ? a.message : '');
          }).join(' ');
          if (
            fullMsg.indexOf('unique "key" prop') !== -1 ||
            fullMsg.indexOf('warning-keys') !== -1 ||
            fullMsg.indexOf('spread into JSX') !== -1 ||
            fullMsg.indexOf('A props object containing') !== -1 ||
            fullMsg.indexOf('React keys must be passed directly') !== -1 ||
            fullMsg.indexOf('Static children should always be an array') !== -1 ||
            fullMsg.indexOf('React.jsx') !== -1 ||
            fullMsg.indexOf('React.jsxs') !== -1 ||
            fullMsg.indexOf('Babel transform instead') !== -1
          ) {
            return;
          }
          return origError.apply(console, arguments);
        };
      })();
    </script>

    <script>
      (function() {
        function syncHeaderHeight() {
          var header = document.getElementById("sticky-header-container");
          if (header) {
            var h = header.offsetHeight;
            if (h > 0) {
              document.documentElement.style.setProperty("--app-header-height", h + "px");
            }
          }
        }
        window.addEventListener("resize", syncHeaderHeight, { passive: true });
        window.addEventListener("scroll", syncHeaderHeight, { passive: true });
        document.addEventListener("DOMContentLoaded", syncHeaderHeight);
        var ro = window.ResizeObserver ? new ResizeObserver(syncHeaderHeight) : null;
        var checkInterval = setInterval(function() {
          var header = document.getElementById("sticky-header-container");
          if (header) {
            syncHeaderHeight();
            if (ro) ro.observe(header);
            clearInterval(checkInterval);
          }
        }, 100);
      })();
    </script>
